<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="900" height="560" rx="8" fill="#3c3c3c"/>
  <rect width="900" height="34" rx="8" fill="#3c3c3c"/>
  <text x="450" y="22" fill="#cccccc" font-size="13" text-anchor="middle">扩展开发宿主 — Hello VSCode 插件 侧边栏（6 个视图）</text>

  <rect y="34" width="52" height="526" fill="#333333"/>
  <rect x="10" y="60" width="32" height="32" rx="4" fill="#094771" stroke="#0098ff"/>
  <g stroke="#75beff" stroke-width="2" fill="none" stroke-linecap="round">
    <rect x="17" y="67" width="18" height="18" rx="2.5"/>
    <line x1="21" y1="73" x2="31" y2="73"/>
    <line x1="21" y1="76.5" x2="31" y2="76.5"/>
    <line x1="21" y1="80" x2="28" y2="80"/>
  </g>
  <rect x="20" y="490" width="12" height="12" fill="#858585"/>
  <circle cx="26" cy="530" r="10" fill="#414141"/>

  <rect x="52" y="34" width="268" height="526" fill="#252526"/>

  <g>
    <rect x="52" y="34" width="268" height="22" fill="#37373d"/>
    <text x="64" y="50" fill="#e7e7e7" font-size="11" font-weight="bold">任务管理器</text>
    <text x="240" y="50" fill="#cccccc" font-size="11">▸ 📄</text>
    <text x="274" y="50" fill="#cccccc" font-size="11">↻</text>
    <g font-size="12">
      <text x="70" y="72" fill="#c5c5c5">▼ 🕐 最近运行</text>
      <text x="96" y="90" fill="#e6e6e6">↑ npm: build</text>
      <text x="70" y="108" fill="#c5c5c5">▼ 📦 tasks.json</text>
      <text x="96" y="126" fill="#e6e6e6">— npm: compile</text>
      <text x="96" y="144" fill="#858585">单击条目 = 运行 · 右键更多操作</text>
    </g>
  </g>

  <g>
    <text x="64" y="168" fill="#bbbbbb" font-size="11" font-weight="bold">收藏夹</text>
    <text x="238" y="168" fill="#cccccc" font-size="11">⭐ 📄</text>
    <text x="274" y="168" fill="#cccccc" font-size="11">↻</text>
    <g font-size="12">
      <text x="70" y="188" fill="#e6e6e6">📄 首页</text>
      <text x="180" y="188" fill="#858585">src/index.ts</text>
      <text x="70" y="206" fill="#e6e6e6">📁 组件库</text>
      <text x="180" y="206" fill="#858585">src/components</text>
      <text x="96" y="224" fill="#858585">单击直达 · 别名右键可改</text>
    </g>
  </g>

  <g>
    <text x="64" y="248" fill="#bbbbbb" font-size="11" font-weight="bold">快捷命令</text>
    <text x="238" y="248" fill="#cccccc" font-size="11">＋ ▶</text>
    <text x="274" y="248" fill="#cccccc" font-size="11">↻</text>
    <g font-size="12">
      <text x="70" y="266" fill="#e6e6e6">▸ 📦 部署</text>
      <text x="96" y="282" fill="#858585">单击在专用终端执行</text>
    </g>
  </g>

  <g>
    <text x="64" y="306" fill="#bbbbbb" font-size="11" font-weight="bold">环境信息</text>
    <text x="274" y="306" fill="#cccccc" font-size="11">↻ 📄</text>
    <text x="70" y="324" fill="#858585" font-size="11">▸ 环境检测 · 正常 · 单项可重检</text>
  </g>

  <g>
    <text x="64" y="348" fill="#bbbbbb" font-size="11" font-weight="bold">环境初始化</text>
    <text x="274" y="348" fill="#cccccc" font-size="11">▶ ☑</text>
    <text x="70" y="366" fill="#858585" font-size="11">▸ 3 个步骤 · 单步可重跑 · 失败不阻断</text>
  </g>

  <g>
    <text x="64" y="390" fill="#bbbbbb" font-size="11" font-weight="bold">任务管理</text>
    <text x="274" y="390" fill="#cccccc" font-size="11">↻</text>
    <text x="70" y="408" fill="#858585" font-size="11">▸ 单击条目打开任务管理面板</text>
  </g>

  <rect x="340" y="34" width="560" height="492" fill="#1e1e1e"/>
  <text x="620" y="120" fill="#dcdcaa" font-size="16" text-anchor="middle" font-weight="bold">六个视图一览</text>
  <g font-size="13" fill="#cccccc">
    <text x="400" y="140">① 任务管理器 —— 工作区 tasks.json 任务树（运行/停止/收藏/定位）</text>
    <text x="400" y="168">② 收藏夹 —— 文件/文件夹路径收藏：别名、单击直达（v3.4）</text>
    <text x="400" y="196">③ 快捷命令 —— 终端命令收藏：别名、分组、单击在终端执行（v3.5）</text>
    <text x="400" y="224">④ 环境信息 —— 激活时自动检测 Python / Node / Git 等</text>
    <text x="400" y="252">⑤ 环境初始化 —— 步骤清单，单击执行单步或全部</text>
    <text x="400" y="280">⑥ 任务管理 —— CRUD 分页表格（HTTP 打桩 / 真实接口）</text>
  </g>
  <rect x="380" y="356" width="480" height="140" rx="6" fill="#252526" stroke="#414141"/>
  <text x="396" y="382" fill="#dcdcaa" font-size="12" font-weight="bold">💡 建议的体验顺序</text>
  <text x="396" y="404" fill="#cccccc" font-size="12">先看 ④ 环境信息、⑤ 环境初始化（激活即自动执行），</text>
  <text x="396" y="424" fill="#cccccc" font-size="12">再玩 ② 收藏夹（右键添加）、③ 快捷命令、① 任务管理器、⑥ 任务管理，</text>
  <text x="396" y="444" fill="#cccccc" font-size="12">以上六个视图覆盖模板的全部典型模式。</text>
  <text x="396" y="470" fill="#858585" font-size="12">另有 2 个 Webview 页面（组件画廊 / 任务管理）；</text>
  <text x="396" y="488" fill="#858585" font-size="12">视图标题栏按钮随视图切换（when 条件门禁已校验）。</text>

  <rect y="526" width="900" height="34" fill="#007acc"/>
  <text x="16" y="548" fill="#ffffff" font-size="12">⎇ main</text>
  <text x="780" y="548" fill="#ffffff" font-size="12">扩展开发宿主</text>
</svg>
